# Build output must include the ideas form HTML so Netlify can register the "pixlfit-ideas" form.
# Submissions are stored in the Netlify dashboard. To email perennialwebstudio@gmail.com on each
# submission: Netlify UI → your site → Forms → (form) → Notifications & webhooks → Add notification → Email.

[build]
	command = "npm run build"
	publish = "dist"

# Browsers often request /favicon.ico before reading <link rel="icon">. The asset is a PNG
# (valid ICO is a different binary format); serve it with the correct type via rewrite.
[[redirects]]
	from = "/favicon.ico"
	to = "/favicon.png"
	status = 200
	force = true
